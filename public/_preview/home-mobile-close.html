<!DOCTYPE html>
<html><head><style>body{margin:0;background:#ccc}
iframe{width:375px;height:1400px;border:2px solid red;display:block}
</style></head>
<body>
<iframe id="f" src="/"></iframe>
<script>
document.getElementById('f').addEventListener('load', function() {
  var win = this.contentWindow;
  setTimeout(function() {
    var btn = win.document.querySelector('.nav-toggle');
    if (btn) btn.click();
    setTimeout(function() {
      var backdrop = win.document.querySelector('.nav-backdrop');
      if (backdrop) backdrop.click();
    }, 400);
  }, 300);
});
</script>
</body></html>
